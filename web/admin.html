<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseFrame 管理后台</title>
<style>
  :root { --canvas:#F7F5EF; --ink:#171717; --muted:#6E6B66; --line:#D9D5CC; --cobalt:#1C49D8; --ok:#217A54; --bad:#B42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:32px 20px 80px; }
  h1 { font-family:Georgia,"Songti SC",serif; font-size:28px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:24px; }
  h2 { font-family:Georgia,serif; font-size:18px; margin:32px 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .card b { display:block; font-size:22px; }
  .card span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:12.5px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid #EFEDE6; vertical-align:middle; }
  th { background:#F2F0E9; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  tr:last-child td { border-bottom:none; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  img.thumb { width:36px; height:45px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:zoom-in; background:#eee; }
  #login { max-width:360px; margin:120px auto; text-align:center; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:#fff; }
  button { margin-top:10px; width:100%; padding:11px; border:none; border-radius:10px; background:var(--cobalt); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .bar { display:flex; justify-content:space-between; align-items:center; }
  .refresh { width:auto; margin:0; padding:7px 16px; font-size:12.5px; }
  #viewer { position:fixed; inset:0; background:rgba(23,23,23,.85); display:none; align-items:center; justify-content:center; cursor:zoom-out; z-index:50; }
  #viewer img { max-width:92vw; max-height:92vh; border-radius:8px; }
  .wrap { overflow-x:auto; }
</style>
</head>
<body>
<div id="login">
  <h1>MuseFrame 管理后台</h1>
  <p class="sub">输入管理令牌（服务器 .env 中的 ADMIN_TOKEN）</p>
  <input id="tok" type="password" placeholder="Admin token">
  <button onclick="saveTok()">进入</button>
  <p id="loginErr" class="bad"></p>
</div>
<main id="app" style="display:none">
  <div class="bar">
    <div><h1>MuseFrame 管理后台</h1><div class="sub" id="stamp"></div></div>
    <button class="refresh" onclick="loadAll()">刷新</button>
  </div>
  <div class="cards" id="cards"></div>
  <h2>生成任务（最近 60 条）</h2>
  <div class="wrap"><table id="jobs"></table></div>
  <h2>购买记录</h2>
  <div class="wrap"><table id="purchases"></table></div>
  <h2>用户反馈</h2>
  <div class="wrap"><table id="feedback"></table></div>
</main>
<div id="viewer" onclick="this.style.display='none'"><img id="viewerImg"></div>
<script>
const $ = (id) => document.getElementById(id);
let TOK = localStorage.getItem('mf.admin') || '';
function saveTok(){ TOK = $('tok').value.trim(); localStorage.setItem('mf.admin', TOK); boot(); }
async function api(p){
  const r = await fetch(p + (p.includes('?')?'&':'?') + 'admin_token=' + encodeURIComponent(TOK));
  if (r.status === 401) throw new Error('token');
  return r.json();
}
const fmt$ = (m) => '$' + (m/100).toFixed(2);
const ago = (t) => { const s=(Date.now()-new Date(t))/1000; return s<3600?Math.round(s/60)+' 分钟前':s<86400?Math.round(s/3600)+' 小时前':Math.round(s/86400)+' 天前'; };
const thumb = (id) => id ? `<img class="thumb" loading="lazy" src="/v1/admin/assets/${id}/file?admin_token=${encodeURIComponent(TOK)}" onclick="view(this.src)">` : '<span class="muted">—</span>';
function view(src){ $('viewerImg').src = src; $('viewer').style.display='flex'; }

async function loadAll(){
  const o = await api('/v1/admin/overview');
  const j = o.jobsByStatus;
  $('stamp').textContent = '数据时间 ' + new Date().toLocaleString();
  $('cards').innerHTML = [
    ['用户总数', o.users, '今日 +' + o.usersToday],
    ['生成成功', j.succeeded||0, '失败 ' + (j.failed||0) + ' · 进行中 ' + ((j.running||0)+(j.queued||0))],
    ['平均耗时', (o.succeededAvgSeconds??'—') + ' 秒', '成功任务'],
    ['已发放点数', o.unitsGranted, '已消耗 ' + o.unitsConsumed],
    ['收入(演示)', fmt$(o.revenueMinor), o.purchases.map(p=>p.product+'×'+p.n).join(' ')||'暂无'],
    ['反馈', '👍' + o.feedback.positive + ' 👎' + o.feedback.negative, '风格 Top: ' + (o.topStyles[0]?.name||'—')],
  ].map(c=>`<div class="card"><span>${c[0]}</span><b>${c[1]}</b><span>${c[2]}</span></div>`).join('');

  const jobs = (await api('/v1/admin/jobs')).jobs;
  $('jobs').innerHTML = '<tr><th>原图</th><th>结果</th><th>风格</th><th>状态</th><th>耗时</th><th>尝试</th><th>用户</th><th>时间</th></tr>' +
    jobs.map(x=>`<tr><td>${thumb(x.sourceAssetId)}</td><td>${thumb(x.candidateAssetId)}</td><td>${x.style}</td>
      <td class="${x.status==='succeeded'?'ok':x.status==='failed'?'bad':'muted'}">${x.status}${x.error_code?'<br><span class=muted>'+x.error_code+'</span>':''}</td>
      <td>${x.seconds!=null?x.seconds+'s':'—'}</td><td>${x.attempt_count}</td><td class="muted">${x.user}</td><td class="muted">${ago(x.created_at)}</td></tr>`).join('');

  const pu = (await api('/v1/admin/purchases')).purchases;
  $('purchases').innerHTML = '<tr><th>商品</th><th>金额</th><th>状态</th><th>用户</th><th>时间</th></tr>' +
    (pu.length ? pu.map(p=>`<tr><td>${p.product}</td><td>${fmt$(p.amount_minor)}</td><td>${p.status}</td><td class="muted">${p.user}</td><td class="muted">${ago(p.purchased_at)}</td></tr>`).join('') : '<tr><td colspan=5 class=muted>暂无购买</td></tr>');

  const fb = (await api('/v1/admin/feedback')).feedback;
  $('feedback').innerHTML = '<tr><th>评价</th><th>原因</th><th>风格</th><th>时间</th></tr>' +
    (fb.length ? fb.map(f=>`<tr><td>${f.rating==='positive'?'👍':'👎'}</td><td>${JSON.parse(f.reason_codes||'[]').join(', ')||'—'}</td><td>${f.style||'—'}</td><td class="muted">${ago(f.created_at)}</td></tr>`).join('') : '<tr><td colspan=4 class=muted>暂无反馈</td></tr>');
}

async function boot(){
  if (!TOK) return;
  try { await loadAll(); $('login').style.display='none'; $('app').style.display='block'; }
  catch(e){ $('loginErr').textContent = e.message==='token' ? '令牌不正确' : '加载失败：' + e.message; localStorage.removeItem('mf.admin'); }
}
boot();
</script>
</body>
</html>
